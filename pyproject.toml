[project]
name = "agent_harness"
version = "0.1.0"
description = "Build and run a pure Python agent and harness against oMLX"
readme = "README.md"
authors = [
    { name = "blitterated", email = "blitterated@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
